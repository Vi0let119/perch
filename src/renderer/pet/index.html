<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' petpack: data:; connect-src 'self' petpack:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="bubble" class="hidden">
    <button id="bubble-close" class="bubble-close" title="关闭（有新的计划开始时再提醒）">×</button>
    <div id="bubble-head">
      <span id="bubble-title">进行中</span>
      <span id="bubble-count"></span>
    </div>
    <div id="bubble-list"></div>
    <div id="bubble-reminder" class="hidden"></div>
    <div id="bubble-next"></div>
  </div>
  <div id="pet-wrap">
    <div id="pet" class="interactive">
      <img id="layer-bg" class="layer" draggable="false" />
      <img id="layer-body" class="layer" draggable="false" />
      <img id="layer-face" class="layer" draggable="false" />
      <img id="layer-left" class="layer" draggable="false" />
      <img id="layer-right" class="layer" draggable="false" />
    </div>
    <div id="err" class="hidden"></div>
  </div>
  <script src="../vendor/live2dcubismcore.min.js"></script>
  <script src="../vendor/pixi.min.js"></script>
  <script src="../vendor/pixi-live2d-cubism4.min.js"></script>
  <script src="pet.js"></script>
</body>
</html>
